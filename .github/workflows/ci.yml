name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Semantic audit
        run: scripts/semantic-audit.sh
      - name: Immutable release guard contract
        run: scripts/verify-immutable-release.sh --contract
      - name: Measured compile build test conformance integration
        run: |
          out="${RUNNER_TEMP}/gooo-semantic-dialect-migrator-ci-${GITHUB_RUN_ID}"
          scripts/ci-metrics.sh "$out"
          test -s "$out/conformance/conformance-index.json"
          test -s "$out/conformance/metrics.json"
          test -s "$out/conformance/ci-summary.md"
          test -s "$out/runner-measurements/runner-observations.json"
      - name: Vet
        run: go vet ./...
      - name: Repository remains unchanged
        run: git diff --exit-code
      - name: Upload conformance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gooo-semantic-dialect-migrator-conformance
          path: ${{ runner.temp }}/gooo-semantic-dialect-migrator-ci-${{ github.run_id }}/
